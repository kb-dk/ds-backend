#
# This is the single configuration file for bff, loaded via the 'application-config' Tomcat context environment
# entry (see conf/ocp/bff.xml) / Jetty EnvEntry (see src/test/jetty/jetty-env.xml) and read by
# dk.kb.oauth.config.ServiceConfig (backed by SmallRye Config, a MicroProfile Config implementation).
#
# Sensitive information such as real secrets (keycloak.secret, secretSalt) MUST NOT be committed here. Instead,
# override them via the separate devops/operations properties override file (see bff-application.properties.SAMPLE
# and the 'application-properties-config' JNDI entry), environment variables, or system properties - all of which
# take priority over this file. See dk.kb.oauth.config.ServiceConfig's class javadoc for the full ordinal scheme.
#

# Sample configuration values below. Remove from concrete application

# Auto-reload: unlike the other ds-backend modules, bff reloads this entire configuration file every
# 'intervalms' milliseconds (a background thread rebuilds the configuration and atomically swaps it in), so that
# operational changes - most importantly a rotated 'secretSalt' - take effect without a service restart.
# Set 'enabled: false' (or remove this section) to load the configuration once at startup like every other module.
config:
  autoupdate:
    enabled: true
    intervalms: 60000

# Keycloak configuration
keycloak:
  url: "https://keycloak.example.com"
  realm: "ds-poc"
  clientID: "bff-poc"
  # Real value should come from the devops/operations properties override file (keycloak.secret=...), not here.
  secret: ""

# Default: false
redirectAfterAuthentication: false

# Cookie settings
cookies:
  # Boolean, default: true
  secure: true
  # Boolean, default: true
  httponly: true
  # Valid values: none, lax, strict
  # Enum, default: Strict
  # See https://owasp.org/www-community/SameSite
  samesite: 'Strict'
  # String, optional
#  domain: example.com
  # String, optional
#  path: '/'


# secretSalt has no default here on purpose: it must be provided by the devops/operations properties override
# file (secretSalt=...), environment variables, or system properties - never committed to git.
#secretSalt: "must_be_overridden_so_no_default"

# Available APIs
# baseURLs will be combined with the service ID: 'ds-image' + 'https://localhost/' = 'https://localhost/ds-image'
apis:
#  ds-image:
#    baseURL: "https://localhost/"
#  poc-middleware:
#    baseURL: "http://localhost:9061"

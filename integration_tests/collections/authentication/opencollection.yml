opencollection: 1.0.0

info:
  name: authentication
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  scripts:
    - type: after-response
      code: |-
        function onResponse(res) {
          if (bru.hasGlobalEnvVar("token")) {
            req.setHeader("Authorization", "Bearer " + bru.getGlobalEnvVar("token"));
          } else {
            console.warn("No global token found — request may fail authentication.");
          }
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git

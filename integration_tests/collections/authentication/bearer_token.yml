info:
  name: bearer_token
  type: http
  seq: 1

http:
  method: post
  url: "{{baseUrl}}/realms/{{realms}}/protocol/openid-connect/token"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
      - name: ""
        value: code
      - name: grant_type
        value: password
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        bru.setGlobalEnvVar("token", data.access_token)

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

info:
  name: POST summaries - update existing row is idempotent
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/summaries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      [
        {
          "id": "{{id1}}",
          "fileId": "{{fileId1}}",
          "summary": "{{summary1}}",
          "created": "{{created}}",
          "jobId": "bruno-it-update"
        }
      ]
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("re-posting an existing row updates exactly 1 row", function () {
          expect(res.getBody().count).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

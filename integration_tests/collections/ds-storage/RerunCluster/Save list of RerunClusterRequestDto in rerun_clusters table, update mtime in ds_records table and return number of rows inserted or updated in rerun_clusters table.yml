info:
  name: Save list of RerunClusterRequestDto in rerun_clusters table, update mtime in ds_records table and return number of rows inserted or updated in rerun_clusters table
  type: http
  seq: 1
  tags:
    - RerunCluster

http:
  method: POST
  url: "{{baseUrl}}/rerun-cluster"
  body:
    type: json
    data: |-
      [
        {
          "id": "",
          "fileId": "",
          "rerunClusterId": "",
          "created": "",
          "jobId": ""
        }
      ]
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Return the number of rows inserted or updated in rerun_clusters table.
    request:
      url: "{{baseUrl}}/rerun-cluster"
      method: POST
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "fileId": "",
              "rerunClusterId": "",
              "created": "",
              "jobId": ""
            }
          ]
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0
          }

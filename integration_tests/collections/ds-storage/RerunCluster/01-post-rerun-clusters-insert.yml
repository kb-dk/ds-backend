info:
  name: POST rerun-cluster - insert (2 items)
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/rerun-cluster"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      [
        {
          "id": "{{id1}}",
          "fileId": "{{fileId1}}",
          "rerunClusterId": "{{rerunClusterId}}",
          "rerunClusterIdCount": 2,
          "created": "{{created}}",
          "jobId": "bruno-it"
        },
        {
          "id": "{{id2}}",
          "fileId": "{{fileId2}}",
          "rerunClusterId": "{{rerunClusterId}}",
          "rerunClusterIdCount": 2,
          "created": "{{created}}",
          "jobId": "bruno-it"
        }
      ]

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });
        test("content-type is JSON", function () {
          expect(res.getHeader("content-type")).to.include("application/json");
        });
        test("body has integer count", function () {
          const body = res.getBody();
          expect(body).to.have.property("count");
          expect(Number.isInteger(body.count)).to.be.true;
        });
        test("count equals number of items sent (2)", function () {
          expect(res.getBody().count).to.equal(2);
        });

settings:
  encodeUrl: true

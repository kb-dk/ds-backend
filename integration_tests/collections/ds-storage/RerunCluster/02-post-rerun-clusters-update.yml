info:
  name: POST rerun-cluster - update existing row is idempotent
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/rerun-cluster"
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      [
        {
          "id": "{{id1}}",
          "fileId": "{{fileId1}}",
          "rerunClusterId": "{{rerunClusterId}}",
          "rerunClusterIdCount": 2,
          "created": "{{created}}",
          "jobId": "bruno-it-update",
          "inserted": "{{created}}",
          "updated": "{{created}}"
        }
      ]

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 201", function () {
          expect(res.getStatus()).to.equal(201);
        });
        test("re-posting an existing row updates exactly 1 row", function () {
          // NOTE: MySQL/MariaDB report 2 for an updated row in ON DUPLICATE KEY UPDATE.
          expect(res.getBody().count).to.equal(1);
        });

settings:
  encodeUrl: true

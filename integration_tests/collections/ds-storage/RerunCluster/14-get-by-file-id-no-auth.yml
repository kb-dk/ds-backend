info:
  name: GET rerun-cluster/{fileId} - no token returns 401
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/rerun-cluster/{{fileId1}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("does not leak data", function () {
          const b = res.getBody();
          expect(b && b.fileId).to.not.equal(bru.getEnvVar("fileId1"));
        });

settings:
  encodeUrl: true

info:
  name: Return latest created datetime from rerun_clusters table. Can be null
  type: http
  seq: 3
  tags:
    - RerunCluster

http:
  method: GET
  url: "{{baseUrl}}/rerun-cluster/created/latest"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Latest created datetime from rerun_clusters table. Can be null.
    request:
      url: "{{baseUrl}}/rerun-cluster/created/latest"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "created": "2021-01-30T08:30:00Z"
          }

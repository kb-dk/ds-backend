info:
  name: Create a new transcription or update an existing. Primary key is fileId
  type: http
  seq: 2
  tags:
    - Transcription

http:
  method: POST
  url: "{{baseUrl}}/transcription"
  body:
    type: json
    data: |-
      {
        "fileId": "a3332323-3323233-333333",
        "fileName": "a3332323-3323233-333333.mp3",
        "transcription": "This is linie1. This is linie2",
        "transcriptionLines": "00:00 - 10:00 This is line1.\n10:00 - 20:00 This is line2"
      }
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response (DSRecord)
    description: No Content - The request has been executed correct and the server did not deliver any content.
    request:
      url: "{{baseUrl}}/transcription"
      method: POST
      body:
        type: json
        data: |-
          {
            "fileId": "a3332323-3323233-333333",
            "fileName": "a3332323-3323233-333333.mp3",
            "transcription": "This is linie1. This is linie2",
            "transcriptionLines": "00:00 - 10:00 This is line1.\n10:00 - 20:00 This is line2"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""

docs: Create or update an existring transcription. Primary key is fileId.  Will touch the record if there is one with this fileId

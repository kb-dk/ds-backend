info:
  name: Get full transcription by fileId, this is the filename for the stream
  type: http
  seq: 1
  tags:
    - Transcription

http:
  method: GET
  url: "{{baseUrl}}/transcription"
  params:
    - name: fileId
      value: ""
      type: query
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Get the full transcription by fileId. Will return null if no transcription is found.
    request:
      url: "{{baseUrl}}/transcription"
      method: GET
      params:
        - name: fileId
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "fileId": "",
            "fileName": "",
            "mTime": 0,
            "transcription": "",
            "transcriptionLines": ""
          }

docs: Get entry from the mapping table for the referenceId. Will return empty transcriptionDto if transcription is not found.

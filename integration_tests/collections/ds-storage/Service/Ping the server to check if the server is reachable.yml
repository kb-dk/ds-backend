info:
  name: Ping the server to check if the server is reachable
  type: http
  seq: 1
  tags:
    - Service

http:
  method: GET
  url: "{{baseUrl}}/monitor/ping"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/monitor/ping"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: ""

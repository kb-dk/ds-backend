info:
  name: Extract OAuth2 accessToken in the `Authorization` HTTP header and return the roles from it
  type: http
  seq: 3
  tags:
    - Service

http:
  method: GET
  url: "{{baseUrl}}/monitor/whoami"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/monitor/whoami"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": {
              "present": true,
              "valid": false,
              "error": "",
              "roles": [
                "read",
                "write",
                "admin"
              ]
            }
          }

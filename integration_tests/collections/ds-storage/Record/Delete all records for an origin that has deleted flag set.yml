info:
  name: Delete all records for an origin that has deleted flag set
  type: http
  seq: 3
  tags:
    - Record

http:
  method: DELETE
  url: "{{baseUrl}}/origin/cleanup"
  params:
    - name: origin
      value: ${config:origins[*].name}
      type: query
      description: The origin to delete records from.
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/origin/cleanup"
      method: DELETE
      params:
        - name: origin
          value: ${config:origins[*].name}
          type: query
          description: The origin to delete records from.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0
          }

docs: |
  Notice that applications retrieving records from the deleted origin never will know that the records were deleted unless the application retrieves the records after they have been marked with the delete flag.

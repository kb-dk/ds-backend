info:
  name: Extract X records from a origin
  type: http
  seq: 11
  tags:
    - Record

http:
  method: GET
  url: "{{baseUrl}}/records"
  params:
    - name: origin
      value: ${config:origins[*].name}
      type: query
      description: Origin. Will only extract records from this origin
    - name: recordType
      value: COLLECTION
      type: query
      description: Only extract records with this recordtype. This will also load local tree for record. If null all recordstypes will be loaded.
      disabled: true
    - name: recordType
      value: DELIVERABLEUNIT
      type: query
      description: Only extract records with this recordtype. This will also load local tree for record. If null all recordstypes will be loaded.
      disabled: true
    - name: recordType
      value: MANIFESTATION
      type: query
      description: Only extract records with this recordtype. This will also load local tree for record. If null all recordstypes will be loaded.
      disabled: true
    - name: mTime
      value: "0"
      type: query
      description: |
        Format is milliseconds since Epoch with 3 added digits. (see documentation in top). Start value will be excluded. It is up to the caller to keep track of mTime when batching the extracting for retrieval between separate calls, by using the last received in the next call.
    - name: maxRecords
      value: "1000"
      type: query
      description: Maximum number of records to return. -1 means no limit.
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: List of DsRecords
    request:
      url: "{{baseUrl}}/records"
      method: GET
      params:
        - name: origin
          value: ${config:origins[*].name}
          type: query
          description: Origin. Will only extract records from this origin
        - name: recordType
          value: COLLECTION
          type: query
          description: Only extract records with this recordtype. This will also load local tree for record. If null all recordstypes will be loaded.
          disabled: true
        - name: recordType
          value: DELIVERABLEUNIT
          type: query
          description: Only extract records with this recordtype. This will also load local tree for record. If null all recordstypes will be loaded.
          disabled: true
        - name: recordType
          value: MANIFESTATION
          type: query
          description: Only extract records with this recordtype. This will also load local tree for record. If null all recordstypes will be loaded.
          disabled: true
        - name: mTime
          value: "0"
          type: query
          description: |
            Format is milliseconds since Epoch with 3 added digits. (see documentation in top). Start value will be excluded. It is up to the caller to keep track of mTime when batching the extracting for retrieval between separate calls, by using the last received in the next call.
        - name: maxRecords
          value: "1000"
          type: query
          description: Maximum number of records to return. -1 means no limit.
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "[]"

docs: |
  Extract X records from a specified origin after a given mTime and up to a defined maximum mTime.  The records are returned in sorted order by mTime increasing. Records marked for delete will also be returned. If a recordtype type is defined it will only load records of this type and the local tree will also be loaded.                

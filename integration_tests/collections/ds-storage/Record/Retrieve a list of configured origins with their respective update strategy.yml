info:
  name: Retrieve a list of configured origins with their respective update strategy
  type: http
  seq: 1
  tags:
    - Record

http:
  method: GET
  url: "{{baseUrl}}/origin/config"
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: A list of configured origin with update strategy
    request:
      url: "{{baseUrl}}/origin/config"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "name": "${config:origins[0].name}",
              "updateStrategy": "NONE"
            }
          ]

docs: |
  This endpoint delivers a list of all configured origins. An origin defines which collection data comes from. This could for instance be the Radio & TV collection at The Royal Danish Library, which has the origin defined as 'ds.radiotv'. The update strategy defines how data from the specific origin is updated, when a record is added, modified or deleted.

info:
  name: Update a record with the Kaltura id
  type: http
  seq: 8
  tags:
    - Record

http:
  method: POST
  url: "{{baseUrl}}/record/updateKalturaId"
  params:
    - name: referenceId
      value: ""
      type: query
    - name: kalturaId
      value: ""
      type: query
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 204 Response
    description: No Content - The request has been executed correct and the server did not deliver any content.
    request:
      url: "{{baseUrl}}/record/updateKalturaId"
      method: POST
      params:
        - name: referenceId
          value: ""
          type: query
        - name: kalturaId
          value: ""
          type: query
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""

docs: Update a record with the Kaltura id. The record was uploaded to Kaltura with the referenceId as metadata. Knowing the kalturaId is important to find the record(stream) in Kaltura later for update or deletion etc.

info:
  name: Touch a record, changing its mTime to the current time
  type: http
  seq: 10
  tags:
    - Record

http:
  method: POST
  url: "{{baseUrl}}/record/touch/:id"
  params:
    - name: id
      value: ds.tv:oai:du:3006e2f8-3f73-477a-a504-4d7cb1ae1e1c
      type: path
      description: Record ID
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: The request has been executed correct and the server did not deliver any content in return
    request:
      url: "{{baseUrl}}/record/touch/:id"
      method: POST
      params:
        - name: id
          value: ds.tv:oai:du:3006e2f8-3f73-477a-a504-4d7cb1ae1e1c
          type: path
          description: Record ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0
          }

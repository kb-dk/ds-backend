info:
  name: Mark a record with delete flag
  type: http
  seq: 6
  tags:
    - Record

http:
  method: DELETE
  url: "{{baseUrl}}/record/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Record ID
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/record/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
          description: Record ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0
          }

docs: |
  This will not delete the record in the database but only mark it as deleted.

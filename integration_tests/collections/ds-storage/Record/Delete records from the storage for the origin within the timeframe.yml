info:
  name: Delete records from the storage for the origin within the timeframe
  type: http
  seq: 4
  tags:
    - Record

http:
  method: DELETE
  url: "{{baseUrl}}/origin/records"
  params:
    - name: origin
      value: ${config:origins[*].name}
      type: query
      description: The origin to delete records from.
    - name: mTimeFrom
      value: ""
      type: query
      description: Format is milliseconds since Epoch with 3 added digits. Value is included in the deletion
    - name: mTimeTo
      value: ""
      type: query
      description: Format is milliseconds since Epoch with 3 added digits. Value is included in the deletion
  auth:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.example.com/oauth2/authorize
    callbackUrl: "{{oauth_callback_url}}"
    credentials:
      clientId: "{{oauth_client_id}}"
    scope: generic_ds read write devel admin public any
    state: "{{oauth_state}}"
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: false
      autoRefreshToken: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/origin/records"
      method: DELETE
      params:
        - name: origin
          value: ${config:origins[*].name}
          type: query
          description: The origin to delete records from.
        - name: mTimeFrom
          value: ""
          type: query
          description: Format is milliseconds since Epoch with 3 added digits. Value is included in the deletion
        - name: mTimeTo
          value: ""
          type: query
          description: Format is milliseconds since Epoch with 3 added digits. Value is included in the deletion
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "count": 0
          }

docs: |
  Delete records from the storage for the origin within the timeframe. Records will be deleted and not just marked as deleted. mTimeFrom and mTimeTo will be included in the deletion range.

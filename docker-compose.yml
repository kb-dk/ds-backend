services:
  ds-storage:
    image: ds-storage/master:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: ds-storage
      secrets:
        - maven_settings
        - maven_settings_security
    cap_drop:
      - ALL
    container_name: ds-storage
    depends_on:
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: UTC
      OTEL_SERVICE_NAME: ds-storage
      JAVA_OPTS: -javaagent:/opentelemetry-javaagent.jar
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria:9428/insert/opentelemetry/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://victoria-metrics:8428/opentelemetry/v1/metrics
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8080/ds-storage/v1/monitor/status" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 25s
    ports:
      - "8081:8080"
    env_file:
      - aegis/docker/ds-backend/.env
    networks:
      - ds_archive_network
      - jaeger_network
      - postgres_network
    security_opt:
      - no-new-privileges:true
    volumes:
      - opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar


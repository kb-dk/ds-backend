  ds-discover:
    image: ds-discover/master:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: ds-discover
      secrets:
        - maven_settings
        - maven_settings_security
    cap_drop:
      - ALL
    container_name: ds-discover
    depends_on:
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      TZ: UTC
      OTEL_SERVICE_NAME: ds-discover
      JAVA_OPTS: -javaagent:/opentelemetry-javaagent.jar
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria:9428/insert/opentelemetry/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://victoria-metrics:8428/opentelemetry/v1/metrics
    healthcheck:

      - jaeger_network
      - solr_network
    security_opt:
      - no-new-privileges:true
    volumes:
      - opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar

  ds-image:
    image: ds-image/master:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: ds-image
      secrets:
        - maven_settings
        - maven_settings_security
    cap_drop:
      - ALL
    container_name: ds-image
    depends_on:
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: UTC
      OTEL_SERVICE_NAME: ds-image
      JAVA_OPTS: -javaagent:/opentelemetry-javaagent.jar
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria:9428/insert/opentelemetry/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://victoria-metrics:8428/opentelemetry/v1/metrics
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8080/ds-image/v1/monitor/status" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 25s
    ports:
      - "8086:8080"
    env_file:
      - aegis/docker/ds-backend/.env
    networks:
      - ds_archive_network
      - jaeger_network
    security_opt:
      - no-new-privileges:true
    volumes:
      - opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar

  bff:
    image: bff/master:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
      secrets:
        - maven_settings
        - maven_settings_security
    cap_drop:
      - ALL
    container_name: ds-bff
    depends_on:
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: UTC
      OTEL_SERVICE_NAME: bff
      JAVA_OPTS: -javaagent:/opentelemetry-javaagent.jar
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_INSECURE: true
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria:9428/insert/opentelemetry/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://victoria-metrics:8428/opentelemetry/v1/metrics
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8080/bff/v1/monitor/status" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 25s
    ports:
      - "8091:8080"
    env_file:
      - aegis/docker/ds-backend/.env
    networks:
      - ds_archive_network
      - jaeger_network
      - solr_network
    security_opt:
      - no-new-privileges:true
    volumes:
      - opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0-1
    command: [ "start-dev", "--import-realm", "--http-port=8087" ]
    cap_drop:
      - ALL
    container_name: ds-keycloak
    environment:
      TZ: UTC
      KC_BOOTSTRAP_ADMIN_USERNAME: user
      KC_BOOTSTRAP_ADMIN_PASSWORD: changeit
      KC_HTTP_ENABLED: true
      # Sets the uniform identity for token issuance across your entire environment
      KC_HOSTNAME: http://keycloak.local:8087
      KC_HEALTH_ENABLED: true
    healthcheck:
      test: [ "CMD-SHELL", "[ -f /tmp/HealthCheck.java ] || echo 'public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.http.HttpClient.newHttpClient().send(java.net.http.HttpRequest.newBuilder(new java.net.URI(args[0])).build(), java.net.http.HttpResponse.BodyHandlers.discarding()).statusCode() == 200 ? 0 : 1); } }' > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8087:8087"
    networks:
      ds_archive_network:
        aliases:
          - keycloak.local
    volumes:
      - ./conf/keycloak:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:13.23-alpine3.21
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    container_name: ds-postgres
    environment:
      TZ: UTC
      POSTGRES_DB: digisam
      POSTGRES_USER: digisam
      POSTGRES_PASSWORD: p0stgr3s
    healthcheck:
      test: [ "CMD", "pg_isready", "--username=digisam" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "8088:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./conf/postgres/apply-ordered-sql.sh:/docker-entrypoint-initdb.d/apply-ordered-sql.sh:ro
      - ./conf/postgres/order.txt:/init-scripts/order.txt:ro
      - ./ds-datahandler/src/test/resources/ddl/create_ds_datahandler_db.ddl:/init-scripts/create_ds_datahandler_db.ddl:ro
      - ./ds-license/src/test/resources/ddl/licensemodule_create_db.ddl:/init-scripts/licensemodule_create_db.ddl:ro
      - ./ds-license/src/test/resources/ddl/audit_log_module_create_db.ddl:/init-scripts/audit_log_module_create_db.ddl:ro
      - ./ds-license/src/test/resources/ddl/rightsmodule_create.ddl:/init-scripts/rightsmodule_create.ddl:ro
      - ./ds-storage/src/test/resources/ddl/create_ds_storage.ddl:/init-scripts/create_ds_storage.ddl:ro
      - ./ds-license/src/test/resources/ddl/licensemodule_default_configuration.ddl:/init-scripts/licensemodule_default_configuration.ddl:ro
      - ./ds-license/src/test/resources/ddl/rightsmodule_create_db.ddl:/init-scripts/rightsmodule_create_db.ddl:ro
      - ./ds-license/src/test/resources/ddl/rightsmodule_default_dr_holdback_categories_data.sql:/init-scripts/rightsmodule_default_dr_holdback_categories_data.sql:ro
      - ./ds-license/src/test/resources/ddl/rightsmodule_default_dr_holdback_ranges_data.sql:/init-scripts/rightsmodule_default_dr_holdback_ranges_data.sql:ro
      - ./ds-license/src/test/resources/ddl/licensemodule_create_devel_license.sql:/init-scripts/licensemodule_create_devel_license.sql:ro
    networks:
      - postgres_network
    security_opt:
      - no-new-privileges:true

  solr:
    image: solr-image/master:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: solr
    cap_drop:
      - ALL
    container_name: ds-solr
    environment:
      TZ: UTC
      SOLR_MODULES: extraction,langid,ltr,analysis-extras,scripting
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:8983/solr/ds-collection_shard1_replica_n1/admin/ping?wt=json" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "8089:8983"
      - "9983:9983"
    env_file:
      - aegis/docker/ds-backend/.env
    command: [ "solr-foreground", "-c" ]
    volumes:
      - solr_data:/opt/solr/server/solr/writable
    networks:
      - solr_network
    security_opt:
      - no-new-privileges:true

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    environment:
      TZ: UTC
      LOG_LEVEL: debug
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "16686:16686"
      - "16687:16687"
      - "4317:4317"
      - "4318:4318"
    networks:
      - jaeger_network

  victoria:
    image: victoriametrics/victoria-logs:v1.52.0
    environment:
      TZ: UTC
    ports:
      - "9428:9428"
    volumes:
      - victoria_logs_data:/victoria_logs_data
    networks:
      - jaeger_network

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    environment:
      TZ: UTC
    ports:
      - "8428:8428"
    volumes:
      - victoria_metrics_data:/victoria_metrics_data
    networks:
      - jaeger_network

volumes:
  solr_data:
  keycloak_data:
  postgres_data:
  victoria_logs_data:
  victoria_metrics_data:

secrets:
  maven_settings:
    file: ~/.m2/settings.xml
  maven_settings_security:
    file: ~/.m2/settings-security.xml

networks:
  ds_archive_network:
    name: ds_archive_network
    driver: bridge
  jaeger_network:
    name: jaeger_network
    driver: bridge
  postgres_network:
    name: postgres_network
    driver: bridge
  solr_network:
    name: solr_network
    driver: bridge

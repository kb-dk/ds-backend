#
# This config contains developer specific overrides, such as read-only account credentials and test server locations.
#
# If will be automatically merged with the bff-base.yaml upon application start.
# Values in the bff-local.yaml files takes precedence over the behaviour file as the files are sorted
# alphanumerically by name and applied in order.
#
# This config is controlled by the individual developer and is not part of the code repository.

keycloak:
  url: "${keycloak_url}"
  realm: "${keycloak_realm}"
  clientID: "${keycloak_client_id}"
  secret: "${keycloak_client_secret}"

# Available APIs
# baseURLs will be combined with the service ID: 'ds-image' + '${image_url}' = 'http://${image_url}/ds-image'
apis:
  ds-image:
    baseURL: "${image_url}"
  ds-present:
    baseURL: "${present_url}"
  ds-licence:
    baseURL: "${license_url}"
  ds-discover:
    baseURL: "${discover_url}"
  search:
    baseURL: "${discover_url}/solr/ds/select"
  record:
    baseURL: "${present_url}/record"
  mlt:
    baseURL: "${discover_url}/solr/ds/mlt"
  suggest:
    baseURL: "${discover_url}/solr/ds/suggest"
  thumbnail:
    baseURL: "${image_url}/kaltura/thumbnails"
  kbdrupal-da:
    baseURL: "${kb_url}/jsonapi/node/site/e065d5e7-a348-4384-9859-c17841d03019"
  kbdrupal-en:
    baseURL: "${kb_url}/en/jsonapi/node/site/e065d5e7-a348-4384-9859-c17841d03019"

# Default: false
redirectAfterAuthentication: false

# Cookie settings
cookies:
  # Boolean, default: true
  secure: true
  # Boolean, default: true
  httponly: true
  # Valid values: none, lax, strict
  # Enum, default: Strict
  # See https://owasp.org/www-community/SameSite
  samesite: "None"
  # String, optional
  #domain: example.com
  # String, optional
  path: "/"

secretSalt: "${secret_salt}"

#Enable auto refresh to enable refresh of encryption salt
config:
  autoupdate:
    enabled: true
    intervalms: 60000

messages:
  partnerId: "${kaltura_partner_id}"
  videoUiConfId: "${kaltura_video_ui_conf_id}"
  audioUiConfId: "${kaltura_audio_ui_conf_id}"
  coverage: 38
  streamingBaseUrlVideo: "${kaltura_api_url}/p/${path:messages.partnerId}/embedPlaykitJs/uiconf_id/${path:messages.videoUiConfId}"
  streamingBaseUrlAudio: "${kaltura_api_url}/p/${path:messages.partnerId}/embedPlaykitJs/uiconf_id/${path:messages.audioUiConfId}"
